<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskFlow – Register</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <h1 class="brand">TaskFlow</h1>
    <h2>Register</h2>

    <form class="form-group" onsubmit="event.preventDefault(); register();">
        <input type="email" id="email" placeholder="Email" autocomplete="username" required />
        <input type="password" id="password" placeholder="Password (8–72 characters)"
               autocomplete="new-password" minlength="8" maxlength="72" required />
        <button type="submit">Register</button>
    </form>

    <p class="switch-page">Already have an account? <a href="login.html">Login here</a></p>
</div>

<script src="script.js"></script>
</body>
</html>
