spring.application.name=taskflow-api
server.port=8081

# Machine-specific settings (DB_PASSWORD, JWT_SECRET, ...) live in an untracked local.properties file.
# Copy local.properties.example to local.properties, or set the same names as environment variables.
spring.config.import=optional:file:./local.properties

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway migrations in db/migration; Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: the secret has no default on purpose, so the app refuses to start without one (min. 32 characters)
taskflow.jwt.secret=${JWT_SECRET:}
taskflow.jwt.expiration=${JWT_EXPIRATION:1h}
taskflow.jwt.issuer=taskflow-api

# Browser origins allowed to call the API (comma-separated)
taskflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173}

# Only the health endpoint is exposed, and it is public so load balancers / Docker can probe it
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.persistAuthorization=true
springdoc.default-produces-media-type=application/json
